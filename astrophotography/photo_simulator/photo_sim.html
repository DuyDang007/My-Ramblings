<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mô phỏng chụp ảnh Long Exposure</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #1e1e24;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h2 {
            margin-bottom: 20px;
            color: #4da6ff;
        }

        .viewports {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .viewport-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .viewport-box label {
            margin-bottom: 8px;
            font-weight: bold;
            color: #ccc;
        }

        canvas {
            width: 384px; /* Scaled down hiển thị cho gọn, kích thước pixel thực tế vẫn là 768x768 */
            height: 384px;
            border: 2px solid #444;
            background-color: #000;
            border-radius: 4px;
        }

        .controls {
            background-color: #2a2a32;
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .control-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .control-group label {
            width: 200px;
            font-size: 14px;
        }

        .control-group input[type="range"] {
            flex-grow: 1;
            margin: 0 15px;
            cursor: pointer;
        }

        .value-display {
            width: 80px;
            text-align: right;
            font-weight: bold;
            color: #00e676;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        #btnCapture {
            padding: 12px 40px;
            font-size: 16px;
            font-weight: bold;
            background-color: #ff5252;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        #btnCapture:hover {
            background-color: #ff1744;
        }

        #btnCapture:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        #statusText {
            font-size: 14px;
            color: #ffca28;
            height: 20px;
        }
    </style>
</head>
<body>

    <h2>Chương Trình Mô Phỏng Chụp Ảnh</h2>

    <div class="viewports">
        <div class="viewport-box">
            <label>Cảnh gốc (Live View 10 FPS)</label>
            <canvas id="liveCanvas" width="768" height="768"></canvas>
        </div>
        <div class="viewport-box">
            <label>Ảnh kết quả</label>
            <canvas id="resultCanvas" width="768" height="768"></canvas>
        </div>
    </div>

    <div class="controls">
        <!-- Sliders -->
        <div class="control-group">
            <label for="isoSlider">ISO:</label>
            <input type="range" id="isoSlider" min="0" max="6" step="1" value="0">
            <span id="isoVal" class="value-display">100</span>
        </div>

        <div class="control-group">
            <label for="exposureSlider">Tốc độ màn trập (Exposure):</label>
            <input type="range" id="exposureSlider" min="0" max="7" step="1" value="2">
            <span id="expVal" class="value-display">1/10s</span>
        </div>

        <div class="control-group">
            <label for="apertureSlider">Khẩu độ (Aperture):</label>
            <input type="range" id="apertureSlider" min="0" max="5" step="1" value="3">
            <span id="apertureVal" class="value-display">F8</span>
        </div>

        <div class="btn-container">
            <button id="btnCapture">CHỤP</button>
            <div id="statusText"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // HỆ SỐ CẤU HÌNH (Có thể tinh chỉnh tại đây)
        // ==========================================
        const ISO_COEFFICIENT = 0.0005;
        const APERTURE_COEFFICIENT = 0.003;
        const NOISE_COEFFICIENT = 0.0014;

        // Dữ liệu các nấc thông số
        const ISO_VALUES = [100, 200, 400, 800, 1600, 3200, 6400];
        
        const EXPOSURE_CONFIG = [
            { label: '1/100s', ms: 10 },
            { label: '1/50s',  ms: 20 },
            { label: '1/10s',  ms: 100 },
            { label: '1s',     ms: 1000 },
            { label: '2s',     ms: 2000 },
            { label: '5s',     ms: 5000 },
            { label: '10s',    ms: 10000 },
            { label: '30s',    ms: 30000 }
        ];

        const APERTURE_CONFIG = [
            { label: 'F2.8', value: 32 },
            { label: 'F4',   value: 16 },
            { label: 'F6.3', value: 8 },
            { label: 'F8',   value: 4 },
            { label: 'F16',  value: 2 },
            { label: 'F22',  value: 1 }
        ];

        // Khởi tạo các phần tử DOM
        const liveCanvas = document.getElementById('liveCanvas');
        const liveCtx = liveCanvas.getContext('2d', { willReadFrequently: true });
        
        const resultCanvas = document.getElementById('resultCanvas');
        const resultCtx = resultCanvas.getContext('2d');

        const isoSlider = document.getElementById('isoSlider');
        const exposureSlider = document.getElementById('exposureSlider');
        const apertureSlider = document.getElementById('apertureSlider');

        const isoVal = document.getElementById('isoVal');
        const expVal = document.getElementById('expVal');
        const apertureVal = document.getElementById('apertureVal');

        const btnCapture = document.getElementById('btnCapture');
        const statusText = document.getElementById('statusText');

        // Tải ảnh Background và Foreground
        const bgImg = new Image();
        const fgImg = new Image();
        let bgLoaded = false;
        let fgLoaded = false;

        bgImg.src = 'background.png';
        fgImg.src = 'foreground.png';

        bgImg.onload = () => { bgLoaded = true; };
        fgImg.onload = () => { fgLoaded = true; };

        // Xử lý khi thiếu file ảnh (Vẽ ảnh mẫu tạm thời để test)
        bgImg.onerror = () => {
            console.warn("Không tìm thấy background.png, sử dụng hình mẫu tạm.");
            const canvas = document.createElement('canvas');
            canvas.width = 768; canvas.height = 1376;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 0, 1376);
            grad.addColorStop(0, '#1a2a6c');
            grad.addColorStop(0.5, '#b21f1f');
            grad.addColorStop(1, '#fdbb2d');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 768, 1376);
            for(let y = 0; y < 1376; y += 40) {
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fillRect(50, y, 668, 10);
            }
            bgImg.src = canvas.toDataURL();
            bgLoaded = true;
        };

        fgImg.onerror = () => {
            console.warn("Không tìm thấy foreground.png, sử dụng hình mẫu tạm.");
            const canvas = document.createElement('canvas');
            canvas.width = 768; canvas.height = 768;
            const ctx = canvas.getContext('2d');
            ctx.strokeStyle = '#00ffff';
            ctx.lineWidth = 15;
            ctx.strokeRect(50, 50, 668, 668);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.font = 'bold 40px Arial';
            ctx.fillText('FOREGROUND (Trong suốt)', 120, 400);
            fgImg.src = canvas.toDataURL();
            fgLoaded = true;
        };

        // Biến điều khiển Animation
        let bgY = 0;
        const bgMaxY = 1376 - 768; // Chiều cao dịch chuyển tối đa
        let isCapturing = false;

        // Cập nhật nhãn slider
        function updateSliderLabels() {
            isoVal.textContent = ISO_VALUES[isoSlider.value];
            expVal.textContent = EXPOSURE_CONFIG[exposureSlider.value].label;
            apertureVal.textContent = APERTURE_CONFIG[apertureSlider.value].label;
        }

        isoSlider.oninput = updateSliderLabels;
        exposureSlider.oninput = updateSliderLabels;
        apertureSlider.oninput = updateSliderLabels;
        updateSliderLabels();

        // Vòng lặp Render Cảnh Gốc (10 FPS = 100ms)
        function drawLiveScene() {
            // Xóa khung hình
            liveCtx.clearRect(0, 0, 768, 768);

            // 1. Vẽ Background (Dịch chuyển lên 1px mỗi frame)
            if (bgLoaded) {
                // Tọa độ y của background dịch chuyển lên
                liveCtx.drawImage(bgImg, 0, bgY, 768, 768, 0, 0, 768, 768);
            }

            // 2. Vẽ Foreground (Cố định chồng lên trên)
            if (fgLoaded) {
                liveCtx.drawImage(fgImg, 0, 0, 768, 768);
            }

            // Cập nhật vị trí background cho frame tiếp theo (cuộn lặp lại khi đến đáy)
            bgY = (bgY + 1) % (bgMaxY + 1);
        }

        // Chạy Animation với tốc độ 10 FPS (100ms / frame)
        setInterval(() => {
            drawLiveScene();
        }, 100);

        // ==========================================
        // XỬ LÝ CHỤP ẢNH (LONG EXPOSURE)
        // ==========================================
        btnCapture.onclick = async () => {
            if (isCapturing) return;
            
            isCapturing = true;
            btnCapture.disabled = true;
            isoSlider.disabled = true;
            exposureSlider.disabled = true;
            apertureSlider.disabled = true;

            // Lấy thông số cấu hình hiện tại
            const iso = ISO_VALUES[isoSlider.value];
            const exposureMs = EXPOSURE_CONFIG[exposureSlider.value].ms;
            const apertureValue = APERTURE_CONFIG[apertureSlider.value].value;

            // Khởi tạo buffer tích lũy màu sắc (float32 để giữ độ chính xác khi cộng dồn)
            const pixelCount = 768 * 768;
            const accumBuffer = new Float32Array(pixelCount * 4); // R, G, B, A

            // Tính hệ số nhân từng frame
            const multiplier = (iso * ISO_COEFFICIENT) * (apertureValue * APERTURE_COEFFICIENT);

            // Số frame cần lấy mẫu (mỗi frame là 100ms = 10 FPS)
            // Nếu exposureMs < 100ms, tính theo tỉ lệ fraction của 1 frame
            let step = 0;
            const totalSteps = Math.max(1, Math.floor(exposureMs / 100));

            statusText.textContent = `Đang chụp... 0%`;

            for (let i = 0; i < exposureMs; i += 100) {
                step++;
                
                // Trường hợp phơi sáng ngắn hơn 100ms (ví dụ 1/100s = 10ms), giảm tỉ lệ lấy nhận sáng
                const frameFraction = Math.min(1.0, (exposureMs - i) / 100.0);
                const currentMultiplier = multiplier * frameFraction;

                // Đọc dữ liệu pixel từ live view hiện tại
                const frameData = liveCtx.getImageData(0, 0, 768, 768).data;

                // Cộng dồn pixel theo công thức
                for (let px = 0; px < frameData.length; px += 4) {
                    let noise = Math.random() * iso * NOISE_COEFFICIENT;
                    accumBuffer[px]     += frameData[px]     * currentMultiplier + noise; // Red
                    noise = Math.random() * iso * NOISE_COEFFICIENT;
                    accumBuffer[px + 1] += frameData[px + 1] * currentMultiplier + noise; // Green
                    noise = Math.random() * iso * NOISE_COEFFICIENT;
                    accumBuffer[px + 2] += frameData[px + 2] * currentMultiplier + noise; // Blue
                    accumBuffer[px + 3]  = 255;                                   // Alpha luôn là 255
                }

                // Cập nhật thanh trạng thái
                const progress = Math.round((step / totalSteps) * 100);
                statusText.textContent = `Đang chụp... ${Math.min(100, progress)}%`;

                // Đợi 100ms tương ứng đúng thời gian thực của frame tiếp theo
                if (exposureMs >= 100) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                }
            }

            // Tạo ImageData kết quả và clamp giá trị max 255
            const resultImageData = resultCtx.createImageData(768, 768);
            const outputData = resultImageData.data;

            for (let px = 0; px < accumBuffer.length; px += 4) {
                outputData[px]     = Math.min(255, accumBuffer[px]);     // Red
                outputData[px + 1] = Math.min(255, accumBuffer[px + 1]); // Green
                outputData[px + 2] = Math.min(255, accumBuffer[px + 2]); // Blue
                outputData[px + 3] = 255;                                // Alpha
            }

            // Vẽ lên Canvas kết quả
            resultCtx.putImageData(resultImageData, 0, 0);

            // Hoàn tất
            statusText.textContent = "Hoàn tất!";
            setTimeout(() => { statusText.textContent = ""; }, 3000);

            isCapturing = false;
            btnCapture.disabled = false;
            isoSlider.disabled = false;
            exposureSlider.disabled = false;
            apertureSlider.disabled = false;
        };
    </script>
</body>
</html>
